<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>설문 응답 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 벤토 그리드 첫 화면(강조 타일 + 연령 도넛 + 작은 색 타일 3개) → 핵심 요약 → 설문 순서 묶음(묶음마다 파스텔 색 하나). */
:root {
  --bg: #efedf1;
  --surface: #ffffff;
  --ink: #2c2733;
  --muted: #7b7484;
  --line: #e6e2ea;
  --track: #f1eef4;
  --mauve: #a079a6;
  --coral: #ec7773;
  --amber: #efbd6a;
  --sage: #79b294;
  --sky: #78a3d4;
  --mauve-deep: #87598e;
  --coral-deep: #d4544f;
  --amber-deep: #c98b1f;
  --sage-deep: #3f8a64;
  --sky-deep: #3f78ba;
  --on-amber: #4d3610;
  --accent: var(--mauve-deep);
  --signal: var(--coral-deep);
  --good: var(--sage-deep);
  --warn: var(--amber-deep);
  --shadow: 0 1px 2px rgba(44, 32, 60, 0.04), 0 6px 18px rgba(44, 32, 60, 0.06);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "Poppins", "IBM Plex Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19161d; --surface: #241f29; --ink: #eee9f2; --muted: #a59dae; --line: #352f3c; --track: #2e2934;
    --mauve: #b48bba; --coral: #f08a86; --amber: #f2c983; --sage: #8cc4a6; --sky: #8fb4e0;
    --mauve-deep: #c49bca; --coral-deep: #f29a96; --amber-deep: #f0c070; --sage-deep: #8fd0ae; --sky-deep: #9cc0ea;
    --on-amber: #3a2808; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #19161d; --surface: #241f29; --ink: #eee9f2; --muted: #a59dae; --line: #352f3c; --track: #2e2934;
  --mauve: #b48bba; --coral: #f08a86; --amber: #f2c983; --sage: #8cc4a6; --sky: #8fb4e0;
  --mauve-deep: #c49bca; --coral-deep: #f29a96; --amber-deep: #f0c070; --sage-deep: #8fd0ae; --sky-deep: #9cc0ea;
  --on-amber: #3a2808; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--mauve), var(--coral) 60%, var(--amber)); }
.brand .mark .ico { width: 22px; height: 22px; }
.brand .sub { font-size: 13px; color: var(--muted); }
.top .meta { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.live.err i { background: var(--signal); }
@media (prefers-reduced-motion: no-preference) { .live.pulse i { animation: pulse 1.2s ease-out 2; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.btn { border: 0; background: var(--surface); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 14px; box-shadow: var(--shadow); }
.btn:hover { color: var(--accent); }
.btn.primary { background: var(--ink); color: var(--surface); }
.btn.primary:hover { color: var(--surface); opacity: 0.9; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 0; background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; box-shadow: var(--shadow); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.banner { color: var(--ink); background: color-mix(in srgb, var(--amber) 30%, var(--surface)); padding: 10px 16px; border-radius: 14px; font-size: 14px; }
.banner.err { background: color-mix(in srgb, var(--coral) 25%, var(--surface)); }

/* bento: first screen */
.bento-wrap { display: flex; flex-direction: column; gap: 16px; }
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.tile { border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.tile .t-label { font-size: 14px; font-weight: 600; opacity: 0.92; display: flex; align-items: center; gap: 8px; }
.tile .t-value { font-family: var(--font-data); font-weight: 600; font-size: 40px; line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.tile .t-value small { font-size: 16px; font-weight: 500; margin-left: 4px; font-family: var(--font-body); }
.tile .t-sub { font-size: 13px; opacity: 0.85; }
.tile.hero { grid-column: span 4; background: linear-gradient(150deg, var(--mauve) 0%, var(--mauve-deep) 100%); color: #fff; }
.tile.hero .t-value { font-size: 64px; }
.tile.hero svg { margin-top: auto; }
.tile.hero .spark-line { stroke: #fff; fill: none; stroke-width: 2.5; }
.tile.hero .spark-area { fill: rgba(255, 255, 255, 0.18); }
.tile.hero text { fill: rgba(255, 255, 255, 0.85); font-size: 11px; font-family: var(--font-body); }
.minis { grid-column: span 3; display: grid; grid-auto-rows: 1fr; gap: 16px; }
.minis .tile { padding: 14px 20px; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
.minis .tile .t-value { font-size: 30px; }
.tile.coral { background: var(--coral); color: #fff; }
.tile.amber { background: var(--amber); color: var(--on-amber); }
.tile.sage { background: var(--sage); color: #fff; }
.tile .t-ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.25); }
.tile .t-ico .ico { width: 22px; height: 22px; }
.agecard { grid-column: span 5; }
@media (max-width: 1080px) { .tile.hero { grid-column: span 6; } .agecard { grid-column: span 6; } .minis { grid-column: 1 / -1; grid-auto-rows: auto; grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) { .tile.hero, .agecard { grid-column: 1 / -1; } .minis { grid-template-columns: 1fr; } .tile.hero .t-value { font-size: 52px; } }

/* donut */
.donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.donut { width: 168px; height: 168px; flex: none; }
.donut .c-num { font-family: var(--font-data); font-size: 30px; font-weight: 600; fill: var(--ink); }
.donut .c-lab { font-size: 12px; fill: var(--muted); font-family: var(--font-body); }
.legend-list { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.legend-list li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 3.6em; gap: 10px; align-items: center; padding: 5px 8px; border-radius: 10px; font-size: 14px; }
.legend-list li.most { background: var(--track); font-weight: 600; }
.legend-list i { width: 12px; height: 12px; border-radius: 4px; display: block; }
.legend-list .cnt { font-family: var(--font-data); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.legend-list .shr { font-family: var(--font-data); color: var(--muted); text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card.wide { grid-column: 1 / -1; }
.card header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card header .n { font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.card header h3, .card header h2 { display: flex; align-items: center; gap: 8px; }
.chip { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--track); color: var(--muted); white-space: nowrap; }
.chip.warn { background: color-mix(in srgb, var(--amber) 35%, var(--surface)); color: var(--on-amber); }
.takeaway { font-size: 14.5px; margin: 0; }
.takeaway b { color: var(--c, var(--accent)); }
.help { font-size: 13px; color: var(--muted); margin: 0; padding: 8px 12px; background: var(--track); border-radius: 10px; }
.help b { color: var(--ink); font-weight: 600; }

/* bars: 1위만 진하게, 나머지는 옅게 */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 6.6em; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .lab { overflow-wrap: anywhere; line-height: 1.3; }
.bar .trk { height: 12px; background: var(--track); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: color-mix(in srgb, var(--c, var(--mauve)) 38%, var(--track)); border-radius: 999px; }
.bar.top .fill { background: var(--c, var(--mauve)); }
.bar.top .lab { font-weight: 600; }
.bar .val { text-align: right; font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .val span { color: var(--muted); }
@media (max-width: 480px) { .bar { grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) 6.2em; } }

/* tables */
.tblwrap { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-radius: 6px; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 8em; }
thead th { font-weight: 600; color: var(--muted); font-size: 12px; vertical-align: bottom; white-space: normal; }
tbody td:first-child { color: var(--ink); }
td.heat { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.hl td:first-child { font-weight: 700; color: var(--c, var(--accent)); }
.meanbar { display: inline-block; height: 8px; background: var(--c, var(--mauve)); border-radius: 999px; vertical-align: middle; margin-left: 6px; }

/* svg charts */
svg text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
svg .ax { stroke: var(--line); }
svg .ln { stroke: var(--mauve-deep); fill: none; stroke-width: 2.6; }
svg .dbar { fill: var(--coral); }
svg .dot { fill: var(--mauve-deep); stroke: var(--surface); stroke-width: 2; }
svg .endlab { fill: var(--ink); font-family: var(--font-data); font-size: 13px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--track); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; }
.legend button i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }

/* blue ocean */
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg button { border: 0; background: var(--track); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
.seg button .num { color: var(--muted); font-size: 12px; margin-left: 2px; }
.seg button[aria-pressed="true"] { background: var(--mauve-deep); color: #fff; font-weight: 600; }
.seg button[aria-pressed="true"] .num { color: rgba(255, 255, 255, 0.8); }
.analysis { margin: 0; padding: 14px 16px 14px 34px; background: color-mix(in srgb, var(--mauve) 10%, var(--surface)); border-radius: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.analysis li::marker { color: var(--mauve-deep); }
i.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
tr.ovrow td { font-weight: 600; border-top: 2px solid var(--line); background: var(--track); }
table.umap th { text-align: center; }
table.umap th span { display: block; color: var(--ink); }
table.umap th small, table.umap td small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
table.umap td:first-child { min-width: 9em; }
table.umap td.ucell { text-align: center; font-family: var(--font-data); min-width: 5.5em; height: 44px; background: var(--track); }
table.umap td.hot { outline: 2.5px solid var(--coral-deep); outline-offset: -2.5px; font-weight: 700; }
table.umap tr.nonerow td { border-top: 2px solid var(--line); }

/* insights */
.insights { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
.insights li { padding: 12px 14px 12px 16px; position: relative; font-size: 14px; background: var(--track); border-radius: 14px; }
.insights li::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--ins, var(--mauve)); }
.insights li b { color: var(--ink); }
.insightcard .ico { color: var(--amber-deep); }
.texts { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; max-height: 420px; overflow-y: auto; }
.texts li { background: var(--track); border-radius: 14px; padding: 10px 14px; font-size: 14px; overflow-wrap: anywhere; }
.texts li time { display: block; font-size: 11.5px; color: var(--muted); }

/* sections */
.sec { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 16px; }
.sec-head { display: flex; align-items: center; gap: 14px; padding-top: 18px; }
.sec-head .s-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 22%, var(--surface)); color: var(--c); flex: none; }
.sec-head .s-ico .ico { width: 24px; height: 24px; }
.sec-head h2 { font-size: 21px; }
.sec-head p { margin: 0; color: var(--muted); font-size: 14px; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; }
.nav a { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); text-decoration: none; background: var(--surface); padding: 6px 14px 6px 10px; border-radius: 999px; box-shadow: var(--shadow); }
.nav a i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.nav a:hover { color: var(--c); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 14px; }
.filters select { border: 0; background: var(--surface); border-radius: 999px; padding: 6px 12px; max-width: 100%; box-shadow: var(--shadow); }
.c-mauve { --c: var(--mauve-deep); } .c-coral { --c: var(--coral-deep); } .c-amber { --c: var(--amber-deep); } .c-sage { --c: var(--sage-deep); } .c-sky { --c: var(--sky-deep); }

.small-btn { padding: 3px 12px; font-size: 12.5px; box-shadow: none; background: var(--track); }
.card.fold { padding: 10px 14px; background: transparent; box-shadow: none; }
body.no-help .help, body.no-help .sec-head p, body.no-help .insightcard, body.no-help .card.fold { display: none !important; }

/* presentation mode */
.present-nav { display: none; }
body.present { padding-block: 24px; }
body.present .hide-present, body.present .nav, body.present .filters { display: none !important; }
body.present .sec, body.present .bento-wrap { display: none; }
body.present .sec.on, body.present .bento-wrap.on { display: flex; }
body.present .grid { display: block; }
body.present .sec .card { display: none; font-size: 19px; padding: 32px; }
body.present .sec .card.on { display: flex; }
body.present .card h3 { font-size: 26px; }
body.present .bar { font-size: 18px; grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 8em; }
body.present .bar .trk { height: 20px; }
body.present .bar .val { font-size: 16px; }
body.present .takeaway, body.present .insights li { font-size: 19px; }
body.present table { font-size: 16px; }
body.present svg text { font-size: 13px; }
body.present .present-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); }
.howto { font-size: 14px; }
.howto ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.howto input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font: inherit; color: inherit; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > input { flex: 1 1 240px; min-width: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <div class="brand"><span class="mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span>
        <div><h1 id="title">설문 응답 현황</h1><div class="sub" id="subline">불러오는 중…</div></div></div>
      <div class="tabs hide-present" id="tabs" role="tablist"></div>
    </div>
    <div class="meta hide-present">
      <span class="live" id="live"><i></i><span id="liveText">불러오는 중</span></span>
      <button class="btn" id="helpBtn" type="button" aria-pressed="false">해설 숨기기</button>
      <button class="btn" id="refreshBtn" type="button">지금 새로고침</button>
      <button class="btn primary" id="presentBtn" type="button">발표 모드</button>
    </div>
  </div>
  <div id="banner" class="hide-present"></div>
  <div class="present-nav" id="presentNav">
    <button class="btn" id="prevBtn" type="button">← 이전</button>
    <span class="muted small num" id="slideNo"></span>
    <div class="row"><button class="btn" id="nextBtn" type="button">다음 →</button><button class="btn" id="exitBtn" type="button">발표 끝내기 (Esc)</button></div>
  </div>
  <div id="app"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="schema.js"></script>
<script>
"use strict";
/* ------------------------------------------------------------------
   설정
------------------------------------------------------------------ */
const CFG = Object.assign({ title: "설문 응답 현황", sheets: [{ name: "응답", csv: "" }], endDate: "", goal: 0, refreshSeconds: 60, excludeTest: true }, window.DASHBOARD_CONFIG || {});
const SCHEMA = window.SURVEY_SCHEMA || null;
const TEST_RE = /테스트|test/i;
const params = new URLSearchParams(location.search);
if (params.get("csv")) CFG.sheets = [{ name: params.get("name") || "응답", csv: params.get("csv") }];
const LS_KEY = "survey-dash-links";
function savedLinks() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { return {}; } }
function saveLink(i, url) { try { const s = savedLinks(); s[i] = url; localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {} }

    ${pts.map((p, i) => `<rect class="dbar" rx="3" x="${(x(i) - bw / 2).toFixed(1)}" y="${(by0 - (p.c / maxC) * (BH - 12)).toFixed(1)}" width="${bw.toFixed(1)}" height="${((p.c / maxC) * (BH - 12)).toFixed(1)}"><title>${dayKey(p.d)}${hourly ? ` ${p.d.getHours()}시` : ""}: ${p.c}건</title></rect>`).join("")}
    <line class="ax" x1="${L}" x2="${W - R}" y1="${by0}" y2="${by0}"/>
    ${pts.map((p, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${x(i)}" y="${H - 14}" text-anchor="middle">${hourly ? (p.d.getHours() === 0 || i === 0 ? `${p.d.getMonth() + 1}/${p.d.getDate()} ` : "") + p.d.getHours() + "시" : `${p.d.getMonth() + 1}/${p.d.getDate()}`}</text>` : "").join("")}
  </svg>`;
}
function niceTicks(max, n) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 5, 10].map((k) => k * mag).find((k) => k >= raw) || mag * 10;
  const out = []; for (let v = 0; v <= max + 1e-9; v += st) out.push(Math.round(v)); return out;
}

/* ------------------------------------------------------------------
   전략캔버스 (같은 비교 대상을 여러 요소로 평가한 표가 있을 때)
------------------------------------------------------------------ */
function findCanvases(grids) {
  const numeric = grids.filter((g) => g.numeric && g.max <= 5 && !/전반|overall|종합|만족/i.test(g.name));
  const byLabels = new Map();
  for (const g of numeric) { const key = g.cols.map((c) => c.row).join("|"); if (!byLabels.has(key)) byLabels.set(key, []); byLabels.get(key).push(g); }
  return [...byLabels.values()].filter((gs) => gs.length >= 2);
}
const shortName = (n) => n.replace(/^(Q\d+|II\s*-?\s*\d+)\s*[·.]?\s*/, "");
function canvasSVG(groups, labels, means, on) {
  const W = 900, H = 330, L = 60, R = 52, T = 14, B = 64;
  const iw = W - L - R, ih = H - T - B;
  const lo = Math.min(1, ...groups.flatMap((g, gi) => labels.map((_, li) => means[gi][li]).filter((v) => !isNaN(v))));
  const hi = Math.max(5, ...groups.flatMap((g, gi) => labels.map((_, li) => means[gi][li]).filter((v) => !isNaN(v))));
  const x = (i) => L + (groups.length === 1 ? iw / 2 : (i / (groups.length - 1)) * iw);
  const y = (v) => T + ih - ((v - lo) / (hi - lo)) * ih;
  const ticks = []; for (let v = Math.ceil(lo); v <= hi; v++) ticks.push(v);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="요소별 평균 점수 비교">`;
  s += ticks.map((t) => `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("");
  s += groups.map((g, i) => { const ls = wrapLabel(shortName(g.name), 7); return `<text x="${x(i)}" y="${H - B + 18}" text-anchor="middle">${ls.map((l, k) => `<tspan x="${x(i)}" dy="${k ? 14 : 0}">${esc(l)}</tspan>`).join("")}</text>`; }).join("");
  const order = labels.map((_, li) => li).sort((a, b) => (on.has(a) ? 1 : 0) - (on.has(b) ? 1 : 0));
  for (const li of order) {
    const active = on.has(li), col = SERIES[li % SERIES.length];
    let d = "", pen = false;
    groups.forEach((g, gi) => { const v = means[gi][li]; if (isNaN(v)) { pen = false; return; } d += `${pen ? "L" : "M"}${x(gi).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    s += `<path d="${d}" fill="none" stroke="${active ? col : "var(--line)"}" stroke-width="${active ? (li === 0 ? 4 : 2.4) : 1.6}" stroke-linejoin="round"${active && li !== 0 ? ' stroke-opacity="0.9"' : ""}/>`;
    if (active) s += groups.map((g, gi) => isNaN(means[gi][li]) ? "" : `<circle cx="${x(gi)}" cy="${y(means[gi][li])}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"><title>${esc(labels[li])} · ${esc(g.name)}: ${fmt1(means[gi][li])}</title></circle>`).join("");
  }
  return s + `</svg>`;
}

/* ------------------------------------------------------------------
   화면 구성
------------------------------------------------------------------ */
function render() {
  const D = state.data[state.sheet];
  const app = $("#app");
  if (!D) { app.innerHTML = `<p class="muted">불러오는 중…</p>`; return; }
  if (D.error && !D.headers) { $("#banner").innerHTML = ""; app.innerHTML = setupHTML(D.error); bindSetup(); return; }

  const { headers } = D;
  const hints = D.hints || {};
  const ORD = hints.order || {};
  let rows = D.rows;
  const cls0 = classify(headers, rows, hints);
  const filterable = cls0.singles.filter((c) => countValues(c.vals).items.length <= 15);
  if (state.filterCol && state.filterVal) { const fi = headers.indexOf(state.filterCol); if (fi >= 0) rows = rows.filter((r) => (r[fi] || "").trim() === state.filterVal); }
  const cls = rows === D.rows ? cls0 : classify(headers, rows, hints);
  const N = rows.length;
  const dates = cls.time ? cls.time.vals.map(parseDate).filter(Boolean) : [];

  // ---- KPI
  const now = new Date(); const today = dayKey(now);
  const todayN = dates.filter((d) => dayKey(d) === today).length;
  const firstD = dates.length ? new Date(Math.min(...dates)) : null;
  const lastD = dates.length ? new Date(Math.max(...dates)) : null;
  const elapsedDays = firstD ? Math.max(1, (now - firstD) / 864e5) : 0;
  const perDay = firstD ? N / elapsedDays : 0;
  const end = CFG.endDate ? new Date(CFG.endDate + "T23:59:59") : null;
  const daysLeft = end ? Math.max(0, Math.ceil((end - now) / 864e5)) : null;
  const projected = end && firstD && (now - firstD) >= 2 * 864e5 ? Math.round(N + perDay * Math.max(0, (end - now) / 864e5)) : null;
  const subTotal = state.filterVal ? `필터 적용 · 전체 ${D.rows.length}건` : CFG.goal ? `목표 ${CFG.goal}건의 ${pct(N, CFG.goal)}%` : D.excluded ? `테스트 응답 ${D.excluded}건 제외` : "건";
  const kpis = `<div class="kpis">
    <div class="kpi hero"><span class="label">총 응답</span><span class="value">${N.toLocaleString()}</span><span class="sub">${subTotal}</span></div>
    <div class="kpi"><span class="label">오늘</span><span class="value">+${todayN}</span><span class="sub">${now.getMonth() + 1}월 ${now.getDate()}일</span></div>
    <div class="kpi"><span class="label">하루 평균</span><span class="value">${perDay ? perDay.toFixed(1) : "-"}</span><span class="sub">첫 응답 이후</span></div>
    <div class="kpi"><span class="label">마지막 응답</span><span class="value" style="font-size:22px">${lastD ? timeAgo(lastD) : "-"}</span><span class="sub">${lastD ? `${lastD.getMonth() + 1}/${lastD.getDate()} ${String(lastD.getHours()).padStart(2, "0")}:${String(lastD.getMinutes()).padStart(2, "0")}` : ""}</span></div>
    ${end ? `<div class="kpi"><span class="label">마감까지</span><span class="value">D-${daysLeft}</span><span class="sub">${CFG.endDate.slice(5).replace("-", "/")} 마감</span></div>` : ""}
    ${end ? `<div class="kpi"><span class="label">마감 시 예상</span><span class="value">${projected != null ? "≈" + projected : "-"}</span><span class="sub">${projected != null ? "지금 속도 유지 시" : "수집 2일째부터 계산"}</span></div>` : ""}
  </div>`;

  const opt = (v, cur, label) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label ?? v)}</option>`;
  const fcCol = cls0.singles.find((c) => c.name === state.filterCol);
  const fcVals = fcCol ? orderItems(countValues(fcCol.vals).items, ORD[fcCol.name]) : [];
  const filters = filterable.length ? `<div class="filters hide-present"><label for="fCol" class="muted">응답자 거르기</label>
    <select id="fCol">${opt("", state.filterCol, "전체 응답자")}${filterable.map((c) => opt(c.name, state.filterCol)).join("")}</select>
    ${state.filterCol ? `<select id="fVal" aria-label="거를 값">${opt("", state.filterVal, "값 선택")}${fcVals.map((x) => opt(x.k, state.filterVal, `${x.k} (${x.c})`)).join("")}</select>` : ""}
    ${state.filterVal ? `<button class="btn" id="fClear" type="button">필터 해제</button>` : ""}</div>` : "";

  const top = [];      // 맨 위 고정 카드
  const qcards = [];   // 문항 카드 (설문 순서대로 정렬)
  const insights = [];
  top.push(card("응답 추이", N, timelineSVG(dates), { wide: true, noChip: true, nLabel: `누적 <span class="num">${N}</span>건`, take: perDay ? `하루 평균 <b>${perDay.toFixed(1)}건</b>씩 들어오고 있습니다${projected != null ? `. 이 속도면 마감일까지 약 <b>${projected}건</b>이 모입니다.` : "."}` : "" }));
  if (N) insights.push(`지금까지 <b>${N}명</b>이 응답했습니다${todayN ? ` (오늘 ${todayN}명)` : ""}${D.excluded ? `. 테스트 응답 ${D.excluded}건은 뺐습니다` : ""}.`);
  if (N && N < 30) insights.push(`응답이 30건 미만이라 비율이 크게 흔들릴 수 있습니다. 해석은 참고용으로만 하세요.`);

  // ---- 블루오션 분석: 전략캔버스 + 구매자 효용지도
  // 근거: Kim & Mauborgne(2005) 블루오션 전략, 박경민 외(2023) 연세경영연구 60(1) — 설문 평균으로 As-Is 전략캔버스를 그리고
  //       구매자 효용지도를 고객/비고객 관점으로 나눠 작성한 방식을 따릅니다.
  const SEG = hints.segments || {};
  if (!state.seg) state.seg = {};
  const segRows = (key) => {
    const seg = SEG[key], id = state.seg[key] || "all";
    if (!seg || id === "all") return rows;
    const g = seg.groups.find((x) => x.id === id), ci = headers.indexOf(seg.col);
    if (!g || ci < 0) return rows;
    return rows.filter((r) => { const v = (r[ci] || "").trim(); if (!v) return false; const inn = g.values.includes(v); return g.not ? !inn : inn; });
  };
  const segButtons = (key) => {
    const seg = SEG[key]; if (!seg) return "";
    const cur = state.seg[key] || "all";
    const ci = headers.indexOf(seg.col);
    const count = (g) => g.id === "all" ? rows.length : rows.filter((r) => { const v = (r[ci] || "").trim(); if (!v) return false; const inn = g.values.includes(v); return g.not ? !inn : inn; }).length;
    return `<div class="seg" role="group" aria-label="관점 고르기"><span class="muted small">관점</span>${seg.groups.map((g) => `<button type="button" data-seg="${key}" data-segid="${g.id}" aria-pressed="${g.id === cur}">${esc(g.label)} <span class="num">${count(g)}</span></button>`).join("")}</div>`;
  };
  const canvases = findCanvases(cls.grids);
  const inCanvas = new Set(canvases.flat());
  const blueCards = [];
  canvases.forEach((canvas, ci) => {
    const prefix = (canvas[0].name.match(/^(Q\d+)/) || [])[1];
    const segKey = "canvas";
    const sub = segRows(segKey);
    const labels = canvas[0].cols.map((c) => c.row);
    const stats = canvas.map((g) => g.cols.map((c) => numStats(sub.map((r) => (r[c.i] || "").trim()))));
    const means = stats.map((r) => r.map((s) => s.mean));
    const ns = stats.map((r) => r.map((s) => s.n));
    if (!state.canvasOn) state.canvasOn = {};
    if (!state.canvasOn[ci]) state.canvasOn[ci] = new Set(labels.map((_, i) => i));
    const on = state.canvasOn[ci];
    const title = (hints.canvasTitles && hints.canvasTitles[prefix]) || "전략캔버스";
    const legend = `<div class="legend">${labels.map((l, i) => `<button type="button" data-canvas="${ci}" data-series="${i}" aria-pressed="${on.has(i)}"><i style="background:${SERIES[i % SERIES.length]}"></i>${esc(l)}</button>`).join("")}</div>`;
    // 전반적 평가 행 (논문의 '전반적 만족감' 행)
    const ovName = (hints.canvasOverall || {})[prefix];
    const ovGrid = ovName ? cls.grids.find((g) => g.name === ovName) : null;
    const ov = labels.map((l) => { const c = ovGrid && ovGrid.cols.find((x) => x.row === l); return c ? numStats(sub.map((r) => (r[c.i] || "").trim())) : { n: 0, mean: NaN }; });
    const allMeans = means.flat().filter((v) => !isNaN(v));
    const body0 = segButtons(segKey);
    if (!allMeans.length) { blueCards.push(card(title, 0, body0 + `<p class="muted">이 관점에 해당하는 응답이 아직 없습니다.</p>`, { wide: true, noChip: true })); return; }
    const lo = Math.min(...allMeans), hi = Math.max(...allMeans);
    const table = `<div class="tblwrap"><table><thead><tr><th>전략요소</th>${labels.map((l, i) => `<th><i class="sw" style="background:${SERIES[i % SERIES.length]}"></i>${esc(l)}</th>`).join("")}<th>차이</th></tr></thead><tbody>${canvas.map((g, gi) => {
      const ok = means[gi].filter((v) => !isNaN(v)); const rowMax = ok.length ? Math.max(...ok) : NaN; const spread = ok.length > 1 ? rowMax - Math.min(...ok) : NaN;
      return `<tr><td>${esc(shortName(g.name))}</td>${means[gi].map((v, li) => isNaN(v) ? `<td class="muted">-</td>` : `<td class="heat" style="${heatColor(hi > lo ? (v - lo) / (hi - lo) : 0.5)}" title="${ns[gi][li]}명 평가">${fmt1(v)}${v === rowMax ? " ▲" : ""}</td>`).join("")}<td class="num muted">${isNaN(spread) ? "-" : fmt1(spread)}</td></tr>`;
    }).join("")}${ovGrid ? `<tr class="ovrow"><td>전반적 평가 (0~10점)</td>${ov.map((s) => `<td class="num">${s.n ? fmt1(s.mean) : "-"}</td>`).join("")}<td></td></tr>` : ""}</tbody><tfoot><tr><td class="muted small">평가한 사람 수</td>${labels.map((_, li) => `<td class="num muted small">${Math.max(0, ...ns.map((r) => r[li]))}</td>`).join("")}<td></td></tr></tfoot></table></div>`;
    // 해석 (논문의 As-Is 전략캔버스 서술 방식: 대안 간 차이가 큰 요소 / 대동소이한 요소, 기준 대상의 강점·약점)
    const ref = labels[0];
    const rowsA = canvas.map((g, gi) => {
      const vals = means[gi].map((v, li) => ({ v, li })).filter((x) => !isNaN(x.v));
      const best = vals.slice().sort((a, b) => b.v - a.v)[0];
      const others = vals.filter((x) => x.li !== 0);
      const bestOther = others.slice().sort((a, b) => b.v - a.v)[0];
      return { name: shortName(g.name), refV: means[gi][0], best, bestOther, spread: vals.length > 1 ? Math.max(...vals.map((x) => x.v)) - Math.min(...vals.map((x) => x.v)) : NaN };
    }).filter((x) => x.best);
    const tops = rowsA.filter((x) => x.best.li === 0);
    const behind = rowsA.filter((x) => !isNaN(x.refV) && x.bestOther && x.bestOther.v > x.refV).sort((a, b) => (a.refV - a.bestOther.v) - (b.refV - b.bestOther.v));
    const bySpread = rowsA.filter((x) => !isNaN(x.spread)).sort((a, b) => a.spread - b.spread);
    const flat = bySpread.filter((x) => x.spread <= 0.5);
    const wide = bySpread.slice(-2).reverse();
    const ovBest = ov.map((s, li) => ({ s, li })).filter((x) => x.s.n).sort((a, b) => b.s.mean - a.s.mean)[0];
    const minN = Math.min(...labels.map((_, li) => Math.max(0, ...ns.map((r) => r[li]))));
    const lines = [];
    lines.push(tops.length ? `<b>${esc(ref)}</b>${josa(ref, "이", "가")} 가장 높은 요소는 ${tops.length}개입니다: ${tops.map((x) => `<b>${esc(x.name)}</b>(${fmt1(x.refV)})`).join(", ")}.` : `<b>${esc(ref)}</b>${josa(ref, "이", "가")} 1위인 요소는 없습니다.`);
    if (behind.length) lines.push(`<b>${esc(ref)}</b>${josa(ref, "이", "가")} 가장 크게 뒤처진 요소는 ${behind.slice(0, 3).map((x) => `<b>${esc(x.name)}</b>(${fmt1(x.refV)}, ${esc(labels[x.bestOther.li])} ${fmt1(x.bestOther.v)})`).join(", ")}입니다.`);
    if (wide.length) lines.push(`대안끼리 차이가 가장 큰 요소는 ${wide.map((x) => `<b>${esc(x.name)}</b>(최고 ${esc(labels[x.best.li])}, 차이 ${fmt1(x.spread)}점)`).join(", ")}입니다. 가치곡선이 갈라지는 지점이에요.`);
    lines.push(flat.length ? `대안끼리 점수가 거의 같은 요소(차이 0.5점 이하)는 ${flat.map((x) => `<b>${esc(x.name)}</b>`).join(", ")}입니다. 어느 대안도 차별화하지 못한, 대동소이한 요소예요.` : `모든 요소에서 대안 간 차이가 0.5점을 넘습니다. 가치곡선이 서로 뚜렷하게 구분돼요.`);
    if (ovBest) lines.push(`전반적 평가는 <b>${esc(labels[ovBest.li])}</b>${josa(labels[ovBest.li], "이", "가")} 가장 높습니다(${fmt1(ovBest.s.mean)}점 / 10점).`);
    if (minN < 30) lines.push(`<span class="muted">평가한 사람이 30명보다 적은 대상이 있어(최소 ${minN}명) 아직은 참고용입니다.</span>`);
    insights.push(`${esc(title.replace(/\s*\(.*\)$/, ""))}: ${lines[0]}`);
    const help = `Kim &amp; Mauborgne의 <b>전략캔버스</b>예요. 가로축은 경쟁 요소(전략요소), 세로축은 응답자가 매긴 제공 수준(1~5점 평균)이고, 대안마다 점을 이은 선이 <b>가치곡선</b>이에요. 박경민 외(2023)처럼 설문 평균으로 그린 <b>현재(As-Is) 캔버스</b>이고, 마지막 줄은 전반적 평가예요. 이름 버튼으로 선을 켜고 끌 수 있어요.`;
    blueCards.push(card(title, Math.max(...ns.flat()), body0 + legend + canvasSVG(canvas, labels, means, on) + `<ul class="analysis">${lines.map((l) => `<li>${l}</li>`).join("")}</ul>` + table, { wide: true, help, noChip: true, nLabel: `대안 ${labels.length}개 · 요소 ${canvas.length}개` }));
  });

  // 구매자 효용지도
  const UM = hints.utilityMap;
  const umGrid = UM ? cls.grids.find((g) => g.name === UM.grid) : null;
  if (umGrid) {
    inCanvas.add(umGrid);
    const sub = segRows("utility");
    const code = (v) => String(v).trim().charAt(0);
    const stages = umGrid.cols.map((c, si) => {
      const vals = sub.map((r) => (r[c.i] || "").trim()).filter(Boolean);
      const exp = vals.filter((v) => code(v) !== UM.skip);
      const levers = UM.levers.map((lv) => exp.filter((v) => lv.codes.includes(code(v))).length);
      const none = exp.filter((v) => code(v) === UM.none).length;
      return { label: c.row, theory: (UM.theoryStages || [])[si] || "", n: exp.length, levers, none };
    });
    const cells = []; stages.forEach((s, si) => s.levers.forEach((c, li) => cells.push({ si, li, c, p: s.n ? c / s.n : 0 })));
    const maxP = Math.max(0.01, ...cells.map((x) => x.p));
    const hot = cells.filter((x) => x.c > 0).sort((a, b) => b.p - a.p).slice(0, 3);
    const isHot = (si, li) => hot.some((h) => h.si === si && h.li === li);
    const stageHead = stages.map((s) => `<th><span>${esc(s.label.replace(/^\d+\.\s*/, ""))}</span><small>${esc(s.theory)}</small></th>`).join("");
    const bodyRows = UM.levers.map((lv, li) => `<tr><td><b>${esc(lv.name)}</b><small>${esc(lv.desc)}</small></td>${stages.map((s, si) => { const c = s.levers[li], p = s.n ? c / s.n : 0; return `<td class="ucell${isHot(si, li) ? " hot" : ""}" style="${c ? `background: color-mix(in srgb, var(--coral-deep) ${Math.round(8 + (p / maxP) * 70)}%, var(--surface)); color:${p / maxP > 0.55 ? "#fff" : "var(--ink)"}` : ""}" title="${c}명 / ${s.n}명">${c ? `${isHot(si, li) ? "✕ " : ""}${Math.round(p * 100)}%` : ""}</td>`; }).join("")}</tr>`).join("");
    const noneRow = `<tr class="nonerow"><td><b>불편 없음</b><small>H · 겪었지만 괜찮았음</small></td>${stages.map((s) => { const p = s.n ? s.none / s.n : 0; return `<td class="ucell ok" style="background: color-mix(in srgb, var(--sage) ${Math.round(8 + p * 60)}%, var(--surface))" title="${s.none}명 / ${s.n}명">${s.n ? `${p >= 0.5 ? "○ " : ""}${Math.round(p * 100)}%` : ""}</td>`; }).join("")}</tr>`;
    const table = `<div class="tblwrap"><table class="umap"><thead><tr><th>효용 레버 \\ 구매자 경험 단계</th>${stageHead}</tr></thead><tbody>${bodyRows}${noneRow}</tbody><tfoot><tr><td class="muted small">그 단계를 겪은 사람</td>${stages.map((s) => `<td class="num muted small">${s.n}명</td>`).join("")}</tr></tfoot></table></div>`;
    const lines = [];
    if (hot.length) lines.push(`구매자 효용을 가장 크게 가로막는 칸(✕)은 ${hot.map((h) => `<b>${esc(stages[h.si].label.replace(/^\d+\.\s*/, ""))}</b> 단계의 <b>${esc(UM.levers[h.li].name)}</b>(${Math.round(h.p * 100)}%)`).join(", ")}입니다.`);
    const leverTot = UM.levers.map((lv, li) => ({ lv, c: stages.reduce((a, s) => a + s.levers[li], 0) })).sort((a, b) => b.c - a.c);
    const totExp = stages.reduce((a, s) => a + s.n, 0);
    if (leverTot[0] && leverTot[0].c) lines.push(`여섯 단계를 통틀어 가장 많이 꼽힌 레버는 <b>${esc(leverTot[0].lv.name)}</b>(${esc(leverTot[0].lv.desc)}, ${Math.round((leverTot[0].c / Math.max(1, totExp)) * 100)}%)입니다.`);
    const painS = stages.filter((s) => s.n).map((s) => ({ s, p: 1 - s.none / s.n })).sort((a, b) => b.p - a.p);
    if (painS.length > 1) lines.push(`불편을 겪은 비율이 가장 높은 단계는 <b>${esc(painS[0].s.label.replace(/^\d+\.\s*/, ""))}</b>(${Math.round(painS[0].p * 100)}%), 가장 낮은 단계는 <b>${esc(painS[painS.length - 1].s.label.replace(/^\d+\.\s*/, ""))}</b>(${Math.round(painS[painS.length - 1].p * 100)}%)입니다.`);
    const untouched = UM.levers.filter((lv, li) => stages.every((s) => !s.levers[li]));
    if (untouched.length) lines.push(`아무도 꼽지 않은 레버: ${untouched.map((lv) => esc(lv.name)).join(", ")}.`);
    // 두 관점 비교 (논문의 전문의/일반인 관점 구분에 해당)
    const segU = SEG.utility;
    if (segU && (state.seg.utility || "all") === "all") {
      const ci = headers.indexOf(segU.col);
      const topFor = (g) => {
        const rs = rows.filter((r) => { const v = (r[ci] || "").trim(); if (!v) return false; const inn = g.values.includes(v); return g.not ? !inn : inn; });
        let best = null;
        umGrid.cols.forEach((c, si) => { const ex = rs.map((r) => (r[c.i] || "").trim()).filter((v) => v && code(v) !== UM.skip); UM.levers.forEach((lv, li) => { const k = ex.filter((v) => lv.codes.includes(code(v))).length; const p = ex.length ? k / ex.length : 0; if (k && (!best || p > best.p)) best = { si, li, p, n: rs.length }; }); });
        return best;
      };
      const parts = segU.groups.filter((g) => g.id !== "all").map((g) => ({ g, t: topFor(g) })).filter((x) => x.t);
      if (parts.length === 2) lines.push(`관점별로 보면 ${parts.map((x) => `<b>${esc(x.g.short || x.g.label)}</b>(${x.t.n}명)는 <b>${esc(stages[x.t.si].label.replace(/^\d+\.\s*/, ""))}·${esc(UM.levers[x.t.li].name)}</b>(${Math.round(x.t.p * 100)}%)`).join(", ")}에서 가장 크게 막힙니다.`);
    }
    if (Math.min(...stages.map((s) => s.n)) < 30) lines.push(`<span class="muted">단계별로 겪은 사람이 30명보다 적은 곳이 있어 아직은 참고용입니다.</span>`);
    if (lines[0]) insights.push(`구매자 효용지도: ${lines[0]}`);
    const help = `Kim &amp; Mauborgne의 <b>구매자 효용지도</b>예요. 가로는 구매자 경험 6단계(구매→인도→사용→보완→유지보수→처분), 세로는 효용 레버예요. 칸 = 그 단계를 겪은 사람 중 그 불편을 <b>가장 큰 불편</b>으로 고른 비율이고, <b>진할수록</b> 효용이 막혀 있다는 뜻이에요. ✕는 가장 진한 3칸, ○는 절반 넘게 ‘불편 없음’이라 답한 단계예요. 논문(박경민 외, 2023)처럼 관점을 나눠 볼 수 있어요.`;
    blueCards.push(card("구매자 효용지도 (Q5)", sub.length, segButtons("utility") + `<ul class="analysis">${lines.map((l) => `<li>${l}</li>`).join("")}</ul>` + table, { wide: true, help, noChip: true, nLabel: `응답 <span class="num">${sub.length}</span>명` }));
  }
  const canvasCards = [];

  // ---- 표형 문항
  for (const g of cls.grids) {
    if (inCanvas.has(g)) continue;
    const rowsLbl = g.cols.map((c) => c.row);
    const respN = rows.filter((r) => g.cols.some((c) => (r[c.i] || "").trim())).length;
    if (!respN) continue;
    const rankRows = rowsLbl.every((l) => /^\d+\s*(순위|위)$|^(1st|2nd|3rd|\d+th)$/i.test(l));
    const order = g.cols[0].i;
    if (g.numeric) {
      const st = g.cols.map((c) => ({ row: c.row, ...numStats(c.vals) }));
      const valid = st.filter((s) => s.n);
      const best = valid.slice().sort((a, b) => b.mean - a.mean)[0];
      const worst = valid.slice().sort((a, b) => a.mean - b.mean)[0];
      const topV = g.max > 5 ? 10 : 5;
      const body = `<div class="tblwrap"><table><thead><tr><th>대상</th><th>평균</th><th></th><th>응답</th><th>?·N/A</th></tr></thead><tbody>${st.map((s) => `<tr${s === best ? ' class="hl"' : ""}><td>${esc(s.row)}</td><td class="heat">${s.n ? fmt1(s.mean) : "-"}</td><td style="text-align:left;width:40%">${s.n ? `<span class="meanbar" style="width:${(s.mean / topV) * 100}%"></span>` : ""}</td><td class="num">${s.n}</td><td class="num muted">${s.na}</td></tr>`).join("")}</tbody></table></div><p class="muted small">막대 끝 = ${topV}점 만점</p>`;
      const take = best && worst && best !== worst ? `가장 높은 평가는 <b>${esc(best.row)}</b>(${fmt1(best.mean)}점), 가장 낮은 평가는 <b>${esc(worst.row)}</b>(${fmt1(worst.mean)}점)입니다.` : "";
      if (take) insights.push(`${esc(g.name.replace(/\s*\(.*\)$/, ""))}: ${take}`);
      qcards.push({ order, html: card(g.name, respN, body, { take, wide: g.cols.length > 6, help: `막대가 길수록 평균 점수가 높아요(${topV}점 만점). ‘?·N/A’는 판단하기 어렵다고 답해 평균에서 뺀 사람 수예요.` }) });
    } else {
      const exclude = (hints.rowShareExclude || {})[g.name] || [];
      const optsRaw = [...new Set(g.cols.flatMap((c) => c.vals.filter(Boolean)))];
      const counts = g.cols.map((c) => optsRaw.map((o) => c.vals.filter((v) => v === o).length));
      let take = "", extra = "";
      if (rankRows) {
        const w = optsRaw.map((o, oi) => ({ k: o, c: counts.reduce((a, row, ri) => a + row[oi] * Math.max(1, rowsLbl.length - ri), 0) })).sort((a, b) => b.c - a.c);
        const firsts = optsRaw.map((o, oi) => ({ k: o, c: counts[0][oi] })).sort((a, b) => b.c - a.c);
        take = `1순위로 가장 많이 고른 기준은 <b>${esc(firsts[0].k)}</b>(${firsts[0].c}명), 순위를 가중한 종합 1위는 <b>${esc(w[0].k)}</b>입니다.`;
        extra = `<p class="muted small" style="margin:0">가중 점수 = 1순위 ${rowsLbl.length}점, 2순위 ${rowsLbl.length - 1}점, 3순위 ${rowsLbl.length - 2}점. 막대의 % = 전체 점수 중 비중</p>` + barsHTML(w, w.reduce((a, b) => a + b.c, 0));
        insights.push(`${esc(g.name.replace(/\s*\[.*$/, ""))}: ${take}`);
      }
      const ord = ORD[g.name];
      const order2 = optsRaw.map((o, oi) => ({ o, oi, t: counts.reduce((a, r) => a + r[oi], 0) }))
        .sort((a, b) => ord ? ((ord.indexOf(a.o) + 1 || 999) - (ord.indexOf(b.o) + 1 || 999)) : b.t - a.t);
      const shares = g.cols.map((c, ri) => { const tot = order2.filter((x) => !exclude.includes(x.o)).reduce((a, x) => a + counts[ri][x.oi], 0); return order2.map((x) => (exclude.includes(x.o) || !tot ? null : counts[ri][x.oi] / tot)); });
      if (!rankRows && !take) {
        const flat = []; g.cols.forEach((c, ri) => order2.forEach((x, k) => { if (shares[ri][k] != null && !/특별히 불편 없었음/.test(x.o)) flat.push({ row: c.row, o: x.o, p: shares[ri][k] }); }));
        const topCell = flat.sort((a, b) => b.p - a.p)[0];
        if (topCell && topCell.p > 0) { take = /Q5/.test(g.name) ? `가장 두드러진 칸은 <b>${esc(topCell.row)}</b> 단계의 <b>${esc(topCell.o)}</b>(${Math.round(topCell.p * 100)}%)입니다.` : `가장 두드러진 칸은 <b>${esc(topCell.row)}</b> → <b>${esc(topCell.o)}</b>(${Math.round(topCell.p * 100)}%)입니다.`; if (/Q5/.test(g.name)) insights.push(`이동하면서 가장 많이 꼽은 불편: ${take}`); }
      }
      const note = (hints.rowShareNote || {})[g.name] || "각 행에서 고른 비율";
      const heat = `<div class="tblwrap"><table><thead><tr><th>${rankRows ? "순위" : ""}</th>${order2.map((x) => `<th>${esc(x.o)}</th>`).join("")}</tr></thead><tbody>${g.cols.map((c, ri) => `<tr><td>${esc(c.row)}</td>${order2.map((x, k) => { const p = shares[ri][k]; const cnt = counts[ri][x.oi]; return p == null ? `<td class="heat muted" title="${cnt}명">${cnt ? cnt + "명" : ""}</td>` : `<td class="heat" style="${heatColor(p)}" title="${cnt}명">${cnt ? Math.round(p * 100) + "%" : ""}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div><p class="muted small">칸 = ${esc(note)}. 칸에 마우스를 올리면 사람 수가 보입니다.</p>`;
      const help = rankRows ? "위 막대는 1순위 3점·2순위 2점·3순위 1점으로 더한 종합 순위예요. 아래 표는 순위별로 각 기준을 고른 비율이고, 진한 칸일수록 많이 골랐어요."
        : /Q5/.test(g.name) ? "줄마다 이동의 한 단계예요. 진한 칸일수록 그 단계에서 그 불편을 고른 사람이 많아요. ‘겪지 않았음’은 비율 계산에서 뺐어요."
        : "줄마다 하나의 대상이에요. 진한 칸일수록 그 답을 고른 사람이 많아요.";
      qcards.push({ order, html: card(g.name.replace(/\s*\[.*$/, ""), respN, extra + heat, { take, wide: true, help }) });
    }
  }

  // ---- 단일 선택
  for (const c of cls.singles) {
    const { n, items } = countValues(c.vals);
    if (!n) continue;
    let its = orderItems(items, ORD[c.name]);
    if (its.length > 12) its = [...its.slice(0, 11), { k: `기타 ${its.length - 11}개`, c: its.slice(11).reduce((a, b) => a + b.c, 0) }];
    const t = items[0], share = pct(t.c, n);
    const take = items.length > 1 ? `<b>${esc(t.k)}</b>이(가) ${share}%로 가장 많습니다${share >= 50 ? " (과반)" : ""}.` : "";
    if (items.length > 1 && n >= 5 && /^Q(3|16|17|2)\./.test(c.name)) insights.push(`${esc(c.name)} → <b>${esc(t.k)}</b> ${share}%`);
    qcards.push({ order: c.i, html: card(c.name, n, barsHTML(its, n), { take }) });
  }
  for (const c of cls.multis) {
    const { n, items } = countValues(c.vals, true);
    if (!n) continue;
    const take = `응답자의 <b>${pct(items[0].c, n)}%</b>가 <b>${esc(items[0].k)}</b>을(를) 골랐습니다.`;
    if (/^Q18/.test(c.name)) insights.push(`${esc(c.name.replace(/\s*\(.*\)$/, ""))} → <b>${esc(items[0].k)}</b> ${pct(items[0].c, n)}%`);
    qcards.push({ order: c.i, html: card(c.name, n, barsHTML(items.slice(0, 15), n), { take, help: "여러 개를 고를 수 있는 문항이라 비율을 더하면 100%가 넘어요." }) });
  }
  for (const c of cls.numerics) {
    const s = numStats(c.vals);
    if (!s.n) continue;
    let body;
    if (c.scale) { const { items } = countValues(c.vals.filter((v) => isNum(v))); body = barsHTML(sortScaleItems(items), s.n); }
    else body = `<p class="muted small">최솟값 ${s.min} · 중앙값 ${s.median} · 최댓값 ${s.max}</p>`;
    qcards.push({ order: c.i, html: card(c.name, s.n, body, { take: `평균 <b>${fmt1(s.mean)}</b>${s.na ? ` · ?·N/A ${s.na}건 제외` : ""}` }) });
  }
  for (const c of cls.texts) {
    const list = rows.map((r, i) => ({ v: (r[c.i] || "").trim(), d: cls.time ? parseDate(cls.time.vals[i]) : null })).filter((x) => x.v).reverse();
    if (!list.length) continue;
    qcards.push({ order: c.i, html: card(c.name, list.length, `<ul class="texts">${list.slice(0, 80).map((x) => `<li>${x.d ? `<time>${x.d.getMonth() + 1}/${x.d.getDate()} ${String(x.d.getHours()).padStart(2, "0")}:${String(x.d.getMinutes()).padStart(2, "0")}</time>` : ""}${esc(x.v)}</li>`).join("")}</ul>`, { take: `최근 응답부터 보여 줍니다${list.length > 80 ? " (최근 80건)" : ""}.`, noChip: true, wide: list.length > 6 }) });
  }

  // ---- 교차 분석
  const crossable = cls.singles.filter((c) => { const k = countValues(c.vals).items.length; return k >= 2 && k <= 15; });
  if (crossable.length >= 2) {
    const has = (nm) => crossable.find((c) => c.name === nm);
    const [dA, dB] = hints.crossDefault || [];
    if (!has(state.crossA)) state.crossA = has(dA) ? dA : crossable[0].name;
    if (!has(state.crossB) || state.crossB === state.crossA) state.crossB = has(dB) && dB !== state.crossA ? dB : crossable.find((c) => c.name !== state.crossA).name;
    const A = has(state.crossA), B = has(state.crossB);
    const aK = orderItems(countValues(A.vals).items, ORD[A.name]).map((x) => x.k), bK = orderItems(countValues(B.vals).items, ORD[B.name]).map((x) => x.k);
    const tab = aK.map((a) => { const idx = A.vals.map((v, i) => (v === a ? i : -1)).filter((i) => i >= 0); const tot = idx.filter((i) => B.vals[i]).length; return { a, tot, cells: bK.map((b) => { const c = idx.filter((i) => B.vals[i] === b).length; return { c, p: pct(c, tot) }; }) }; });
    const body = `<div class="filters hide-present"><label for="cA" class="muted">행</label><select id="cA">${crossable.map((c) => opt(c.name, state.crossA)).join("")}</select><label for="cB" class="muted">열</label><select id="cB">${crossable.filter((c) => c.name !== state.crossA).map((c) => opt(c.name, state.crossB)).join("")}</select></div>
      <div class="tblwrap"><table><thead><tr><th>${esc(A.name)}</th>${bK.map((b) => `<th>${esc(b)}</th>`).join("")}<th>응답</th></tr></thead><tbody>${tab.map((r) => `<tr><td>${esc(r.a)}</td>${r.cells.map((x) => `<td class="heat" style="${heatColor(x.p / 100)}" title="${x.c}명">${r.tot ? x.p + "%" : "-"}</td>`).join("")}<td class="num">${r.tot}</td></tr>`).join("")}</tbody></table></div>
      <p class="muted small">각 행의 합이 100%입니다. 행의 응답 수가 10명 미만이면 비율을 그대로 믿지 마세요.</p>`;
    top.push(card("교차 분석", N, body, { wide: true, noChip: true, take: `<b>${esc(A.name)}</b>에 따라 <b>${esc(B.name)}</b> 응답이 어떻게 달라지는지 봅니다.` }));
  }

  // ---- 연령대 (맨 위)
  const ageCol = cls.singles.find((c) => c.name === (hints.ageColumn || "")) || cls.singles.find((c) => /연령|나이|^age$/i.test(c.name));
  let ageCard = "";
  if (ageCol) {
    const counts = new Map(countValues(ageCol.vals).items.map((x) => [x.k, x.c]));
    const groups = (ORD[ageCol.name] || [...counts.keys()]).filter((k) => counts.has(k) || !/응답 안 함|무응답/.test(k));
    const total = [...counts.values()].reduce((a, b) => a + b, 0);
    const real = groups.filter((k) => !/응답 안 함|무응답/.test(k)).map((k) => ({ k, c: counts.get(k) || 0 }));
    const most = real.slice().sort((a, b) => b.c - a.c)[0], least = real.slice().sort((a, b) => a.c - b.c)[0];
    const parts = groups.map((k, i) => ({ k, c: counts.get(k) || 0, color: /응답 안 함|무응답/.test(k) ? "var(--line)" : PASTEL[i % PASTEL.length] }));
    const legend = `<ul class="legend-list">${parts.map((p) => `<li class="${most && p.k === most.k ? "most" : ""}"><i style="background:${p.color}"></i><span>${esc(p.k)}</span><span class="cnt">${p.c}명</span><span class="shr">${pct(p.c, total)}%</span></li>`).join("")}</ul>`;
    const headline = most && least && most.k !== least.k
      ? `<b>${esc(most.k)}</b>${josa(most.k, "이", "가")} 가장 많고(${pct(most.c, total)}%), <b>${esc(least.k)}</b>${josa(least.k, "이", "가")} 가장 적어요(${least.c}명).`
      : "";
    if (headline) insights.unshift(`응답자는 ${headline}`);
    ageCard = `<section class="card agecard c-mauve"><header><h2>${icon("pie")}연령대별 응답자</h2><span class="n">총 <span class="num">${total}</span>명</span></header>${headline ? `<p class="takeaway">${headline}</p>` : ""}<div class="donut-wrap">${donutSVG(parts, total, "연령대별 응답자 비율")}${legend}</div><p class="help"><b>읽는 법</b> · 도넛 조각이 클수록 그 연령대 응답자가 많아요. 회색 띠로 표시한 줄이 가장 많은 연령대예요.</p></section>`;
  }

  const insColors = ["var(--mauve)", "var(--coral)", "var(--amber)", "var(--sage)", "var(--sky)"];
  const insightBody = `<ul class="insights">${insights.slice(0, 8).map((s, i) => `<li style="--ins:${insColors[i % insColors.length]}">${s}</li>`).join("")}</ul><p class="muted small" style="margin:0">새 응답이 들어올 때마다 다시 계산됩니다. 점수 평균에는 ‘판단하기 어려움(?)’ 답을 넣지 않았습니다.</p>`;
  const insightCard = state.hideInsight
    ? `<div class="card wide fold hide-present"><button class="btn" id="insightShow" type="button" aria-expanded="false">＋ 한눈에 보는 핵심 보기</button></div>`
    : `<section class="card wide insightcard"><header><h2>${icon("bulb")}한눈에 보는 핵심</h2><span class="n"><button class="btn small-btn hide-present" id="insightHide" type="button" aria-expanded="true">숨기기</button></span></header>${insightBody}</section>`;
  const timelineCard = top[0];
  const crossCard = top.find((h) => h.includes("교차 분석")) || "";
  canvasCards.sort((a, b) => a.order - b.order);
  const items = [...canvasCards, ...qcards].sort((a, b) => a.order - b.order)
    .map((x) => ({ ...x, title: (x.html.match(/<h[23]>(.*?)<\/h[23]>/) || [])[1] || "" }))
    .filter((x) => !(ageCol && x.title === esc(ageCol.name)));
  const secs = (hints.sections || []).map((sec) => ({ ...sec, re: new RegExp(sec.match), items: [] }));
  const etc = { id: "etc", title: "그 밖의 문항", desc: "", icon: "compare", color: "sky", items: [] };
  for (const it of items) (secs.find((sec) => sec.re.test(it.title)) || etc).items.push(it);
  const blueSec = { id: "blue", title: "블루오션 분석", desc: "전략캔버스와 구매자 효용지도입니다. Kim & Mauborgne(2005)의 도구를 박경민 외(2023, 연세경영연구 60권 1호)처럼 설문 자료로 그렸어요.", icon: "map", color: "mauve", items: blueCards.map((html) => ({ html })) };
  const allSecs = [blueSec, ...secs, etc].filter((sec) => sec.items.length);
  if (crossCard) allSecs.push({ id: "compare", title: "직접 골라 비교하기", desc: "두 문항을 골라, 한 문항의 답에 따라 다른 문항의 답이 어떻게 달라지는지 봅니다. 예: 연령대별로 자가용을 대하는 태도.", icon: "compare", color: "sky", items: [{ html: crossCard }] });
  const nav = `<nav class="nav hide-present" aria-label="바로가기">${allSecs.map((sec) => `<a href="#${sec.id}" class="c-${sec.color || "mauve"}"><i></i>${esc(sec.title)}</a>`).join("")}</nav>`;
  const secHTML = allSecs.map((sec) => `<section class="sec c-${sec.color || "mauve"}" id="${sec.id}"><div class="sec-head"><span class="s-ico">${icon(sec.icon)}</span><div><h2>${esc(sec.title)}</h2>${sec.desc ? `<p>${esc(sec.desc)}</p>` : ""}</div></div><div class="grid">${sec.items.map((x) => x.html).join("")}</div></section>`).join("");

  const stamp = `${now.getMonth() + 1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
  $("#subline").textContent = `${stamp} 기준${CFG.endDate ? ` · ${+CFG.endDate.slice(5, 7)}월 ${+CFG.endDate.slice(8, 10)}일 마감` : ""}`;
  const heroTile = `<div class="tile hero"><span class="t-label">${icon("users")}지금까지 모인 응답</span><span class="t-value">${N}<small>명</small></span>
    <span class="t-sub">${lastD ? `마지막 응답 ${timeAgo(lastD)}` : "아직 응답 없음"}${D.excluded ? ` · 테스트 ${D.excluded}건 제외` : ""}${state.filterVal ? ` · 필터 적용 중 (전체 ${D.rows.length}명)` : ""}</span>${sparkSVG(dates)}</div>`;
  const mini = (cls2, ic, label, value, unit, sub) => `<div class="tile ${cls2}"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="t-label">${label}</span><span class="t-value">${value}${unit ? `<small>${unit}</small>` : ""}</span>${sub ? `<span class="t-sub">${sub}</span>` : ""}</div><span class="t-ico">${icon(ic)}</span></div>`;
  const minis = `<div class="minis">
    ${mini("coral", "plus", "오늘 들어온 응답", `+${todayN}`, "명", `${now.getMonth() + 1}월 ${now.getDate()}일`)}
    ${end ? mini("amber", "calendar", "마감까지", `D-${daysLeft}`, "", `${+CFG.endDate.slice(5, 7)}월 ${+CFG.endDate.slice(8, 10)}일 마감`) : ""}
  </div>`;

  const banner = (D.demo ? `<div class="banner">지금 보이는 것은 <b>예시 데이터</b>입니다. 실제 응답을 보려면 아래 <b>시트 연결하기</b>를 따라 하세요.</div>` : "") +
    (D.error ? `<div class="banner err">${esc(D.error)} 마지막으로 받은 데이터를 보여 주고 있습니다.</div>` : "");
  $("#banner").innerHTML = banner;
  app.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    <div class="bento-wrap"><div class="bento">${heroTile}${ageCard}${minis}</div>${insightCard}</div>
    ${nav}${filters}${secHTML}${D.demo ? setupHTML() : ""}</div>`;
  bindApp();
  if (D.demo) bindSetup();
  if (document.body.classList.contains("present")) showSlide();
}

// 받침 여부에 따라 조사 고르기 (이/가, 은/는)
function josa(w, withB, without) { const ch = String(w).trim().slice(-1).charCodeAt(0); if (ch < 0xac00 || ch > 0xd7a3) return withB + "(" + without + ")"; return (ch - 0xac00) % 28 ? withB : without; }
function timeAgo(d) {
  const s = (Date.now() - d) / 1000;
  if (s < 60) return "방금"; if (s < 3600) return `${Math.floor(s / 60)}분 전`; if (s < 86400) return `${Math.floor(s / 3600)}시간 전`; return `${Math.floor(s / 86400)}일 전`;
}

function setupHTML(err) {
  const cur = savedLinks()[state.sheet] || CFG.sheets[state.sheet]?.csv || "";
  return `<section class="card wide howto hide-present"><h2>시트 연결하기</h2>
    ${err ? `<p class="banner err" style="margin:0">${esc(err)}</p>` : ""}
    <ol>
      <li>응답이 쌓이는 구글 시트를 엽니다.</li>
      <li>메뉴 <b>파일 → 공유 → 웹에 게시</b>를 누릅니다.</li>
      <li>첫 번째 칸에서 <b>응답이 들어오는 탭</b>을, 두 번째 칸에서 <b>쉼표로 구분된 값(.csv)</b>을 고르고 <b>게시</b>를 누릅니다.</li>
      <li>나온 링크를 복사해 아래에 붙여 넣고 <b>연결</b>을 누릅니다.</li>
    </ol>
    <div class="row"><input id="csvInput" type="url" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv" value="${esc(cur)}" aria-label="CSV 링크"><button class="btn primary" id="csvSave" type="button">연결</button></div>
    <p class="muted small" style="margin:0">여기 붙여 넣은 링크는 <b>이 브라우저에만</b> 저장됩니다. 팀원 모두가 같은 화면을 보려면 <code>config.js</code> 파일의 <code>csv</code> 칸에 같은 링크를 넣어야 합니다.</p>
  </section>`;
}
function bindSetup() {
  const b = $("#csvSave"); if (!b) return;
  b.onclick = () => { const v = $("#csvInput").value.trim(); saveLink(state.sheet, v); load(state.sheet, true); };
}
function bindApp() {
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on("#fCol", "change", (e) => { state.filterCol = e.target.value; state.filterVal = ""; render(); });
  on("#fVal", "change", (e) => { state.filterVal = e.target.value; render(); });
  on("#fClear", "click", () => { state.filterCol = ""; state.filterVal = ""; render(); });
  on("#insightHide", "click", () => { state.hideInsight = true; prefs("hideInsight", true); render(); });
  on("#insightShow", "click", () => { state.hideInsight = false; prefs("hideInsight", false); render(); });
  document.querySelectorAll("[data-seg]").forEach((b) => b.addEventListener("click", () => { state.seg[b.dataset.seg] = b.dataset.segid; render(); }));
  on("#cA", "change", (e) => { state.crossA = e.target.value; render(); });
  on("#cB", "change", (e) => { state.crossB = e.target.value; render(); });
  document.querySelectorAll("[data-series]").forEach((b) => b.addEventListener("click", () => {
    const set = state.canvasOn[+b.dataset.canvas], i = +b.dataset.series; if (set.has(i)) set.delete(i); else set.add(i); render();
  }));
}

/* ------------------------------------------------------------------
   불러오기 + 자동 새로고침
------------------------------------------------------------------ */
async function load(i, force) {
  const raw = savedLinks()[i] || CFG.sheets[i]?.csv || "";
  const url = toCsvUrl(raw);
  const live = $("#live"), liveText = $("#liveText");
  if (!url) { state.data[i] = Object.assign(prepare(SCHEMA ? SCHEMA.demo() : { headers: ["예시"], rows: [] }), { demo: true }); if (i === state.sheet) { render(); liveText.textContent = "예시 데이터"; } return; }
  try {
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(`시트를 불러오지 못했습니다 (오류 ${res.status}). 링크가 '웹에 게시'의 CSV 링크인지 확인하세요.`);
    const text = await res.text();
    if (/^\s*<!doctype html|<html/i.test(text)) throw new Error("CSV가 아니라 웹페이지가 돌아왔습니다. '웹에 게시'에서 형식을 CSV로 골랐는지 확인하세요.");
    const all = parseCSV(text);
    if (!all.length) throw new Error("시트가 비어 있습니다.");
    const prepared = prepare({ headers: all[0].map((h) => h.trim()), rows: all.slice(1) });
    const rows = prepared.rows;
    const prev = state.lastCount[i];
    state.data[i] = prepared;
    state.lastCount[i] = rows.length;
    if (i === state.sheet) {
      live.classList.remove("err");
      liveText.textContent = `${new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })} 확인`;
      if (prev != null && rows.length > prev) { toast(`새 응답 ${rows.length - prev}건`); live.classList.remove("pulse"); void live.offsetWidth; live.classList.add("pulse"); }
      render();
    }
  } catch (e) {
    const msg = e instanceof TypeError ? "시트에 연결하지 못했습니다. 인터넷 연결과 링크를 확인하세요." : e.message;
    const old = state.data[i];
    state.data[i] = old && old.headers && !old.demo ? Object.assign({}, old, { error: msg }) : { error: msg };
    if (i === state.sheet) { live.classList.add("err"); liveText.textContent = "연결 오류"; render(); }
  }
}
// 설문 코드표(schema.js)가 맞으면 열 이름·값을 실제 문항으로 바꿉니다.
function prepare(d) {
  if (SCHEMA && SCHEMA.detect(d.headers)) { const t = SCHEMA.transform(d.headers, d.rows, { excludeTest: CFG.excludeTest ? TEST_RE : null }); t.headers = dedupe(t.headers); return t; }
  return { headers: dedupe(d.headers), rows: d.rows, hints: {} };
}
function dedupe(h) { const seen = {}; return h.map((x) => { x = x.trim(); if (seen[x]) { seen[x]++; return `${x} (${seen[x]})`; } seen[x] = 1; return x; }); }
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3500); }

function renderTabs() {
  const tabs = $("#tabs");
  if (CFG.sheets.length < 2) { tabs.hidden = true; return; }
  tabs.innerHTML = CFG.sheets.map((s, i) => `<button class="tab" role="tab" type="button" aria-selected="${i === state.sheet}" data-tab="${i}">${esc(s.name)}</button>`).join("");
  tabs.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
    state.sheet = +b.dataset.tab; state.filterCol = state.filterVal = state.crossA = state.crossB = ""; state.canvasOn = null; state.slide = 0;
    try { localStorage.setItem("survey-dash-tab", state.sheet); } catch (e) {}
    renderTabs(); render(); load(state.sheet);
  });
}

/* ------------------------------------------------------------------
   발표 모드
------------------------------------------------------------------ */
function slideUnits() {
  const u = []; const b = $("#app .bento-wrap"); if (b) u.push({ wrap: b });
  document.querySelectorAll("#app .sec").forEach((sec) => sec.querySelectorAll(".card:not(.howto)").forEach((c) => u.push({ sec, c })));
  return u;
}
function clearSlides() { document.querySelectorAll("#app .on").forEach((el) => el.classList.remove("on")); }
function showSlide() {
  const u = slideUnits(); if (!u.length) return;
  state.slide = Math.max(0, Math.min(state.slide, u.length - 1));
  clearSlides(); const cur = u[state.slide];
  if (cur.wrap) cur.wrap.classList.add("on"); else { cur.sec.classList.add("on"); cur.c.classList.add("on"); }
  $("#slideNo").textContent = `${state.slide + 1} / ${u.length}`;
  window.scrollTo(0, 0);
}
function setPresent(on) {
  document.body.classList.toggle("present", on);
  if (on) { state.slide = 0; showSlide(); document.documentElement.requestFullscreen?.().catch(() => {}); }
  else { clearSlides(); if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); }
}
$("#presentBtn").onclick = () => setPresent(true);
$("#exitBtn").onclick = () => setPresent(false);
$("#prevBtn").onclick = () => { state.slide--; showSlide(); };
$("#nextBtn").onclick = () => { state.slide++; showSlide(); };
$("#refreshBtn").onclick = () => load(state.sheet, true);
// 해설(읽는 법·묶음 설명·핵심 요약) 숨기기 — 이 브라우저에 기억됩니다.
function prefs(k, v) { try { if (v === undefined) return localStorage.getItem("survey-dash-" + k) === "1"; localStorage.setItem("survey-dash-" + k, v ? "1" : "0"); } catch (e) { return false; } }
function applyHelp() { const off = state.hideHelp; document.body.classList.toggle("no-help", off); const b = $("#helpBtn"); b.textContent = off ? "해설 보기" : "해설 숨기기"; b.setAttribute("aria-pressed", off); }
state.hideHelp = prefs("hideHelp"); state.hideInsight = prefs("hideInsight"); applyHelp();
$("#helpBtn").onclick = () => { state.hideHelp = !state.hideHelp; prefs("hideHelp", state.hideHelp); applyHelp(); };
document.addEventListener("keydown", (e) => {
  if (!document.body.classList.contains("present")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { state.slide++; showSlide(); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { state.slide--; showSlide(); e.preventDefault(); }
  if (e.key === "Escape") setPresent(false);
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("present")) setPresent(false); });

/* ------------------------------------------------------------------ */
try { const t = +localStorage.getItem("survey-dash-tab"); if (t >= 0 && t < CFG.sheets.length) state.sheet = t; } catch (e) {}
renderTabs();
CFG.sheets.forEach((_, i) => load(i));
setInterval(() => { if (!document.hidden) load(state.sheet); }, Math.max(20, CFG.refreshSeconds) * 1000);
setInterval(() => { if (!document.hidden && !document.body.classList.contains("present")) { const D = state.data[state.sheet]; if (D && D.headers) render(); } }, 60000);
</script>
</body>
