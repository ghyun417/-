input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 18px; height: 18px; flex: none; margin: 0; }

legend { font-size: 1.1rem; font-weight: 800; padding: 0 9px 0 0; }
.hint, .description { color: var(--muted); font-size: .9rem; }
.hint { margin: 0 0 12px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.subfield { margin-top: 12px; display: grid; gap: 5px; }
.pick-list { display: grid; gap: 9px; }
.pick-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; gap: 8px 14px; border-bottom: 1px solid var(--line); padding-bottom: 9px; }
label strong, .description { display: block; }
select, input[type=text], textarea { width: 100%; min-width: 0; min-height: 45px; font: inherit; color: var(--ink); background: var(--white); border: 1px solid #aca3bd; border-radius: 9px; padding: 8px 10px; }
select { cursor: pointer; }
.has-value { background: var(--soft); border-color: var(--accent); font-weight: 700; color: var(--accent-dark); }
select:disabled, .matrix-cell input:disabled { background: #eeeaf2; color: #645d73; cursor: default; }
textarea { min-height: 120px; resize: vertical; }
.rank { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rank label { display: grid; gap: 5px; }
details { margin-top: 12px; background: var(--soft); padding: 10px 13px; border-radius: 9px; }
summary { cursor: pointer; color: var(--accent-dark); font-weight: 700; }
details li { margin-bottom: 6px; }
.matrix { display: grid; gap: 0; margin-top: 12px; }
.matrix-row { display: grid; grid-template-columns: minmax(154px, 2.8fr) repeat(5,minmax(64px, 1fr)); align-items: center; column-gap: 7px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.matrix-head { font-size: .81rem; font-weight: 800; color: var(--accent-dark); text-align: center; background: var(--white); position: sticky; top: 0; z-index: 2; }
.matrix-head span:first-child { text-align: left; }
.matrix-cell { display: grid; gap: 3px; min-width: 0; }
.matrix-cell span { display: none; }

button { min-height: 46px; padding: 10px 17px; border: 1px solid transparent; font: inherit; font-weight: 800; border-radius: 10px; cursor: pointer; }
button:disabled { opacity: .65; cursor: wait; }
.primary { background: var(--accent); color: white; }

.secondary { color: var(--accent-dark); background: white; border-color: var(--line); }

footer { color: var(--muted); padding: 18px 4px; text-align: center; font-size: .83rem; }
@media (max-width: 680px) {

const COLLECTION_URL = "";

const titles = ["나에 대해", "나의 최근 이동", "나와 자가용", "이동하며 겪은 불편", "자동차 브랜드 비교", "이동 방법 비교", "현대자동차에 대해", "마지막으로"];

const scores = ["1", "2", "3", "4", "5", "?"];
const overall = Array.from({length: 11}, (_, i) => String(i));
const touchRatings = matchMedia("(pointer: coarse)").matches;
const preview = !COLLECTION_URL || !["http:", "https:"].includes(location.protocol);

function make(tag, props = {}, children = []) {
  const item = Object.assign(document.createElement(tag), props);
  item.append(...children);
  return item;
}

function copy(textContent, className = "hint", tag = "p") {
  return make(tag, {textContent, className});
}

function block(title, children, fieldset = false) {
  return make(fieldset ? "fieldset" : "div", {className: "block"}, [
    copy(title, "", fieldset ? "legend" : "h2"), ...children
  ]);
}

function select(name, label, options, initial = "선택") {
  const element = make("select", {name});
  element.setAttribute("aria-label", label);
  element.append(new Option(initial, ""), ...options.map(option => {
    const [value, text] = Array.isArray(option) ? option : [option, option];
    return new Option(text, value);
  }));
  return element;
}

function field(label, input, className = "subfield") {
  return make("label", {className}, [copy(label, "", "span"), input]);
}

function description(title, detail) {
  const label = make("span", {}, [copy(title, "", "strong")]);
  if (detail) label.append(copy(detail, "description", "span"));
  return label;
}

function choices(name, title, labels, {multi = false, other = false, limit = Infinity} = {}) {
  const group = make("div", {className: "choices"});
  const extra = field("기타 내용을 적어 주세요 (선택)", make("input", {
    type: "text", name: name + "_other", maxLength: 250, disabled: true
  }));
  extra.hidden = true;
  const controls = labels.map(label => {
    const input = make("input", {type: multi ? "checkbox" : "radio", name, value: label});
    group.append(make("label", {className: "choice"}, [input, label]));
    return input;
  });
  group.addEventListener("click", event => {
    const input = event.target;
    if (!multi && input.tagName === "INPUT" && input === group.lastPicked) input.checked = false;
    group.lastPicked = input.checked ? input : null;
    refresh();
  });
  group.addEventListener("change", refresh);
  function refresh() {
    const checked = controls.filter(input => input.checked);
    controls.forEach(input => { input.disabled = checked.length >= limit && !input.checked; });
    if (other) {
      extra.hidden = !checked.some(input => input.value === "기타");
      extra.lastElementChild.disabled = extra.hidden;
    }
  }
  return block(title, other ? [group, extra] : [group], true);
}

function ratingControl(name, label, options) {
  if (touchRatings) return select(name, label, options, "—");
  const range = options === scores ? "1~5 또는 ?" : "0~10";
  const input = make("input", {
    type: "text", name, placeholder: "—", autocomplete: "off",
    inputMode: options === overall ? "numeric" : "text", spellcheck: false
  });
  input.setAttribute("aria-label", label + " (" + range + ")");
  input.addEventListener("input", () => {
    input.value = input.value.normalize("NFKC").trim();
    input.setCustomValidity(!input.value || options.includes(input.value) ? "" : range + "를 입력해 주세요.");
    input.classList.toggle("has-value", !!input.value && input.validity.valid);
  });
  input.addEventListener("focus", () => input.select());
  return input;
}

function matrix(names, rows, key, options) {
  const result = make("div", {className: "matrix"});
  result.append(make("div", {className: "matrix-row matrix-head"}, [
    copy(rows.length > 1 ? "평가 기준" : "응답", "", "span"), ...names.map(([name]) => copy(name, "", "span"))
  ]));
  rows.forEach(([title, detail], i) => {
    const row = make("div", {className: "matrix-row"}, [make("div", {className: "matrix-title"}, [
      description(title, detail)
    ])]);
    names.forEach(([name], j) => {
      const control = ratingControl(key + "_" + (i + 1) + "_" + (j + 1), title + " · " + name, options);
      control.dataset.column = j;
      row.append(make("label", {className: "matrix-cell"}, [copy(name, "", "span"), control]));
    });
    result.append(row);
  });
  return result;
}

function ranking(question, items) {
  const ranking = make("div", {className: "rank"});
  const controls = [1, 2, 3].map(i => select(question + "_" + i, i + "순위", items.map(([title], j) => [String(j + 1), (j + 1) + ". " + title])));
  controls.forEach((control, i) => ranking.append(field((i + 1) + "순위", control, "")));
  ranking.addEventListener("change", () => {
    for (const control of controls) {
      for (const option of control.options) {
        option.disabled = !!option.value && controls.some(other => other !== control && other.value === option.value);
      }
    }
  });
  return ranking;
}

  const [name, names, rows, experience] = ratings[index];

    block((index === 0 ? "Q9. 자동차를" : "Q13. 이동 방법을") + " 고를 때 가장 중요한 기준 3개를 순서대로 골라 주세요.", [ranking(rankKey, rows), definitions]),

      copy((touchRatings ? "각 칸을 눌러 점수를 골라 주세요." : "각 칸에 1~5 또는 ?를 입력해 주세요. Tab 키로 다음 칸으로 이동할 수 있어요.") + " 각 대상을 따로 평가해 주세요. 비용과 부담은 적을수록 높은 점수예요. 직접 이용하지 않았어도 구체적인 정보가 있다면 답해 주세요."),
      scale, grid

$("steps").append(...sections);
$("preview-notice").hidden = !preview;

function showStep(index) {
  stepIndex = index;
  $("welcome").hidden = index >= 0;
  form.hidden = index < 0;
  $("progress").hidden = index < 0;
  sections.forEach((section, i) => { section.hidden = index !== i; });
  $("form-error").hidden = true;
  if (index >= 0) {
    $("step-label").textContent = (index + 1) + " / " + titles.length + " 단계";
    $("step-bar").value = index + 1;
    $("next").textContent = index === titles.length - 1 ? "응답 제출" : "다음 →";
    sections[index].firstElementChild.focus({preventScroll: true});
  } else {
    $("begin").focus({preventScroll: true});
  }
  window.scrollTo(0, 0);
}

function end(title, message) {
  $("welcome").hidden = true;
  $("progress").hidden = true;
  form.hidden = true;
  $("done").hidden = false;
  $("done-title").textContent = title;
  $("done-copy").textContent = message;
  $("done-title").focus();
  window.scrollTo(0, 0);
}

function collect() {
  const response = {};
  for (const [key, value] of new FormData(form)) {
    if (value) (response[key] ||= []).push(value);
  }
  return response;
}

function post(payload) {
  return new Promise((resolve, reject) => {
    const relay = make("iframe", {name: "collector-" + payload.token, title: "응답 전송", hidden: true});
    const data = make("input", {type: "hidden", name: "payload", value: JSON.stringify(payload)});
    const request = make("form", {action: COLLECTION_URL, method: "POST", target: relay.name, hidden: true}, [data]);
    const timeout = setTimeout(() => finish(false), 25000);
    function finish(ok) {
      clearTimeout(timeout);
      window.removeEventListener("message", receive);
      relay.remove();
      request.remove();
      if (ok) resolve();
      else reject(new Error("저장 확인 실패"));
    }
    function receive(event) {
      const googleOrigin = /^https:\/\/(?:script\.google\.com|(?:[a-z0-9-]+\.)*googleusercontent\.com)$/.test(event.origin);
      if (googleOrigin && event.data?.type === "reframe-receipt" && event.data.token === payload.token) {
        finish(event.data.saved === true);
      }
    }
    window.addEventListener("message", receive);
    document.body.append(relay, request);
    request.submit();
  });
}

$("begin").addEventListener("click", () => {
  $("consent-error").hidden = $("consent").checked;
  if (!$("consent").checked) return $("consent").focus();
  showStep(0);
});
$("decline").addEventListener("click", () => end("설문을 종료했어요.", "시간을 내주셔서 감사합니다."));
$("back").addEventListener("click", () => showStep(stepIndex - 1));
form.addEventListener("submit", event => event.preventDefault());
form.addEventListener("change", event => {
  if (event.target.tagName === "SELECT") event.target.classList.toggle("has-value", !!event.target.value);
});
$("next").addEventListener("click", async () => {
  if (pending) return;
  const invalidRating = sections[stepIndex].querySelector(".matrix input:invalid");
  if (invalidRating) {
    invalidRating.reportValidity();
    return;
  }
  if (stepIndex < titles.length - 1) return showStep(stepIndex + 1);
  if (preview) return end("미리보기를 마쳤어요.", "테스트 응답은 저장되지 않았어요.");
  pending = true;
  $("back").disabled = $("next").disabled = true;
  $("next").textContent = "제출하는 중…";
  $("form-error").hidden = true;
  try {
    submissionId ||= crypto.randomUUID();
    await post({version: 1, id: submissionId, token: crypto.randomUUID(), consent: true, answers: collect()});
    end("응답을 제출했어요.", "끝까지 함께해 주셔서 감사합니다.");
  } catch {
    $("form-error").textContent = "응답 저장을 확인하지 못했어요. 입력한 답변은 화면에 남아 있으니 잠시 후 다시 제출해 주세요.";
    $("form-error").hidden = false;
  } finally {
    pending = false;
    $("back").disabled = $("next").disabled = false;
    $("next").textContent = "응답 제출";
  }
});
